<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0e1116" />
    <title>Beltpack</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon-192.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main>
      <h1>Beltpack</h1>

      <div id="banner" hidden>
        <p id="banner-text"></p>
        <p id="banner-from"></p>
      </div>

      <div id="dial" data-state="idle" aria-hidden="true"></div>

      <div class="readout">
        <p id="status" role="status">Not connected</p>
        <p id="detail"></p>
      </div>

      <div id="talk-wrap" hidden>
        <button id="talk" type="button" data-talking="false" aria-label="Talk">
          <svg viewBox="0 0 24 24" aria-hidden="true" width="40" height="40">
            <path fill="currentColor" d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Z"/>
            <path fill="currentColor" d="M19 11a7 7 0 0 1-14 0H3a9 9 0 0 0 8 8.94V23h2v-3.06A9 9 0 0 0 21 11Z"/>
          </svg>
        </button>
        <p id="talk-caption">Hold to talk</p>
      </div>

      <button id="join" type="button" data-connected="false">Join comms</button>

      <form id="settings">
        <label>
          Your position
          <input id="identity" type="text" autocomplete="off" placeholder="Camera 2" />
        </label>
        <label>
          Comms server
          <input id="server" type="text" inputmode="url" autocomplete="off"
                 placeholder="192.168.1.50  or  comms.yourchurch.org" />
        </label>
        <p id="resolved" class="hint" data-bad="false"></p>
        <label>
          When to transmit
          <select id="talkMode">
            <option value="listenOnly">Listen only</option>
            <option value="pushToTalk">Push to talk</option>
            <option value="latch">Latch</option>
            <option value="open">Open mic</option>
          </select>
        </label>
        <label>
          Passcode
          <input id="passcode" type="password" autocomplete="off" />
        </label>
        <p class="hint">You need to be on the comms Wi-Fi for this to connect.</p>
      </form>
    </main>

    <!-- Remote audio elements land here. -->
    <div id="sinks" hidden></div>

    <script type="module" src="./dist/app.js"></script>
  </body>
</html>
