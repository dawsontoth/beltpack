<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0e1116" />
    <title>Beltpack</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main>
      <h1>Beltpack</h1>

      <div id="dial" data-state="idle" aria-hidden="true"></div>

      <div class="readout">
        <p id="status" role="status">Not connected</p>
        <p id="detail"></p>
      </div>

      <button id="join" type="button" data-connected="false">Join comms</button>

      <form id="settings">
        <label>
          Your position
          <input id="identity" type="text" autocomplete="off" placeholder="Camera 2" />
        </label>
        <label>
          Comms server
          <input id="server" type="url" autocomplete="off" placeholder="https://comms.example.org" />
        </label>
        <label>
          Passcode
          <input id="passcode" type="password" autocomplete="off" />
        </label>
        <p class="hint">You need to be on the comms Wi-Fi for this to connect.</p>
      </form>
    </main>

    <!-- Remote audio elements land here. -->
    <div id="sinks" hidden></div>

    <script type="module" src="./dist/app.js"></script>
  </body>
</html>
