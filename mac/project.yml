name: BeltpackHost
options:
  bundleIdPrefix: org.beltpack
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  BeltpackKit:
    path: ../server

targets:
  BeltpackHost:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources
    dependencies:
      - package: BeltpackKit
        product: BeltpackKit
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Beltpack Host
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "14.0"
        # A bundled app gets its own TCC identity, unlike a bare CLI binary
        # whose prompts are attributed to whatever terminal launched it.
        NSMicrophoneUsageDescription: >-
          Beltpack Host captures the console feed from your audio interface.
        # A booth machine, not a document editor.
        LSApplicationCategoryType: public.app-category.utilities
        # No dock icon: this is a booth daemon with a menu bar item, not an
        # app somebody switches to. Still a real bundle, so it keeps its own
        # TCC identity — the reason the microphone prompt works here and not
        # for a bare CLI binary.
        LSUIElement: true
    settings:
      base:
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        # Deliberately unsandboxed: it reads .env from wherever the checkout
        # lives and re-points system audio devices.
        ENABLE_APP_SANDBOX: NO
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    configFiles:
      Debug: ../ios/Local.xcconfig
      Release: ../ios/Local.xcconfig
