name: Beltpack
options:
  bundleIdPrefix: org.beltpack
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift.git
    from: "2.16.0"
  BeltpackKit:
    path: ../server

targets:
  Beltpack:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Shared
      - path: Resources
    dependencies:
      - package: LiveKit
        product: LiveKit
      # Shares PairingLink with the Mac side rather than keeping a second
      # copy that can drift out of agreement about a link's meaning.
      - package: BeltpackKit
        product: BeltpackKit
      - target: BeltpackWatch
        embed: true
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Beltpack
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # The whole reason this is a native app rather than a web page:
        # iOS Safari suspends WebRTC the moment the screen locks.
        UIBackgroundModes:
          - audio
        # Phase 2 only — but declaring it now keeps the TestFlight
        # description stable when push-to-talk lands.
        NSMicrophoneUsageDescription: >-
          Beltpack uses the microphone for push-to-talk on the comms channel.
        # iOS 14+ gates local network access behind a permission prompt, and
        # the comms server lives on the LAN by design. Without this the app
        # simply cannot reach it, with no useful error.
        NSLocalNetworkUsageDescription: >-
          Beltpack connects to the comms server on your local network.
        NSBonjourServices:
          - _beltpack._tcp
        # Permits cleartext to local addresses only, which is what a LAN test
        # without TLS needs. Does not open up arbitrary internet HTTP.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        ITSAppUsesNonExemptEncryption: false
        # Pairing codes open the app directly: beltpack://join?server=…
        CFBundleURLTypes:
          - CFBundleURLName: org.beltpack.pairing
            CFBundleURLSchemes:
              - beltpack
    # Xcode writes CODE_SIGN_ENTITLEMENTS into the pbxproj when a capability
    # is added, and xcodegen regenerates that file — so it has to live here or
    # the next `make ios` quietly drops it.
    entitlements:
      path: Beltpack.entitlements
      properties:
        # Lights the screen and breaks through a Focus. A cue that waits for
        # somebody to check their phone is not a cue.
        #
        # The contents must be declared here, not just the path: xcodegen
        # *generates* this file, and with no properties it writes an empty
        # dict over whatever Xcode put there — the build still succeeds and
        # the signed binary silently carries no entitlement.
        com.apple.developer.usernotifications.time-sensitive: true
    settings:
      base:
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        CODE_SIGN_STYLE: Automatic
        # DEVELOPMENT_TEAM comes from Local.xcconfig, which is gitignored so
        # a team id never lands in a public repo. Copy the .example file.
    configFiles:
      Debug: Local.xcconfig
      Release: Local.xcconfig
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG

  BeltpackWatch:
    type: application
    platform: watchOS
    sources:
      - path: Watch
      - path: Shared
      - path: Resources
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: Beltpack
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        WKApplication: true
        WKCompanionAppBundleIdentifier: org.beltpack.Beltpack
        # Without this the watch returns to the clock a few seconds after the
        # wrist drops, and the talk button is two interactions away at the
        # moment it is wanted. With it the app stays frontmost and dimmed, so
        # raising the wrist shows the button already there — and it keeps
        # receiving state from the phone instead of being torn down.
        WKSupportsAlwaysOnDisplay: true
    settings:
      base:
        # Must be the phone's identifier with .watchkitapp appended, or the
        # two do not validate as companions and the phone app will not even
        # install. XcodeGen's bundleIdPrefix would otherwise name this
        # org.beltpack.BeltpackWatch, which looks reasonable and is wrong.
        PRODUCT_BUNDLE_IDENTIFIER: org.beltpack.Beltpack.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "4"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: NO
        CODE_SIGN_STYLE: Automatic
    # Same gitignored signing config as the phone, so a team id never lands
    # in a public repo.
    configFiles:
      Debug: Local.xcconfig
      Release: Local.xcconfig

  BeltpackTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Beltpack
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Beltpack:
    build:
      targets:
        Beltpack: all
        BeltpackTests: [test]
    test:
      targets:
        - BeltpackTests
    run:
      config: Debug
