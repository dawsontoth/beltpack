name: Beltpack
options:
  bundleIdPrefix: org.beltpack
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift.git
    from: "2.16.0"

targets:
  Beltpack:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - package: LiveKit
        product: LiveKit
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Beltpack
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # The whole reason this is a native app rather than a web page:
        # iOS Safari suspends WebRTC the moment the screen locks.
        UIBackgroundModes:
          - audio
        # Phase 2 only — but declaring it now keeps the TestFlight
        # description stable when push-to-talk lands.
        NSMicrophoneUsageDescription: >-
          Beltpack uses the microphone for push-to-talk on the comms channel.
        # iOS 14+ gates local network access behind a permission prompt, and
        # the comms server lives on the LAN by design. Without this the app
        # simply cannot reach it, with no useful error.
        NSLocalNetworkUsageDescription: >-
          Beltpack connects to the comms server on your local network.
        NSBonjourServices:
          - _beltpack._tcp
        # Permits cleartext to local addresses only, which is what a LAN test
        # without TLS needs. Does not open up arbitrary internet HTTP.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        CODE_SIGN_STYLE: Automatic
        # DEVELOPMENT_TEAM comes from Local.xcconfig, which is gitignored so
        # a team id never lands in a public repo. Copy the .example file.
    configFiles:
      Debug: Local.xcconfig
      Release: Local.xcconfig
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG

  BeltpackTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Beltpack
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Beltpack:
    build:
      targets:
        Beltpack: all
        BeltpackTests: [test]
    test:
      targets:
        - BeltpackTests
    run:
      config: Debug
